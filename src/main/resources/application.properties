# ==========================================================
# Configuracion general de la aplicacion
# ==========================================================
spring.application.name=producto-api
server.port=8080

# ==========================================================
# Conexion a PostgreSQL
# Se leen de variables de entorno para no exponer credenciales
# en el repositorio de GitHub. Los valores por defecto (despues
# de los ":") sirven para correr la app en local facilmente.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/producto_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ddl-auto=update -> el ORM crea/actualiza la tabla "productos"
# automaticamente a partir de la entidad Producto.
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
# Manejo de errores: no exponer stacktraces al cliente,
# el GlobalExceptionHandler ya devuelve un cuerpo JSON limpio.
# ==========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================================
# CORS: origen permitido para el frontend (Netlify en produccion,
# localhost:4200 por defecto en desarrollo).
# ==========================================================
allowed.origin=${ALLOWED_ORIGIN:http://localhost:4200}
